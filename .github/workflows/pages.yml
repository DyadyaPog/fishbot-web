# Публикация статической страницы кабинета игрока на GitHub Pages.
# Сборка не требуется: workflow копирует в артефакт только файлы сайта
# (index.html, config.js, assets/), поэтому README и папка supabase/ на Pages не попадают.

name: Deploy player page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'help.html'
      - 'config.js'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Если заданы repository variables, подставляем реальные адрес и ключ Supabase.
      # Без них страница публикуется с пустыми значениями и работает в демо-режиме.
      - name: Inject Supabase config (optional)
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('config.js')
          s = p.read_text()
          s = re.sub(r"supabaseUrl:\s*''", "supabaseUrl: '${{ vars.SUPABASE_URL }}'", s)
          s = re.sub(r"supabaseAnonKey:\s*''", "supabaseAnonKey: '${{ vars.SUPABASE_ANON_KEY }}'", s)
          p.write_text(s)
          PY

      # Адрес Edge Function авторизации бота (channel:bot). Тоже необязателен:
      # без него кабинет покажет подсказку вместо кнопки. Секретов в статике нет:
      # client_secret и service_role живут только в Supabase secrets.
      - name: Inject Twitch badge function URL (optional)
        if: ${{ vars.TWITCH_BADGE_URL != '' }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('config.js')
          s = p.read_text()
          s = re.sub(r"twitchBadgeUrl:\s*''", "twitchBadgeUrl: '${{ vars.TWITCH_BADGE_URL }}'", s)
          p.write_text(s)
          PY

      # Ник бота в Twitch (логин), который показывается в кабинете рядом со статусом бота.
      - name: Inject bot login (optional)
        if: ${{ vars.TWITCH_BOT_LOGIN != '' }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('config.js')
          s = p.read_text()
          s = re.sub(r"botLogin:\s*''", "botLogin: '${{ vars.TWITCH_BOT_LOGIN }}'", s)
          p.write_text(s)
          PY

      # Собираем чистый артефакт: только то, что должно быть доступно посетителю.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html help.html config.js _site/
          cp -r assets _site/
          test -f _site/index.html
          test -f _site/help.html
          test -f _site/config.js
          test -f _site/assets/app.js
          test -f _site/assets/style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

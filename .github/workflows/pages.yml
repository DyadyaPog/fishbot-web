# Публикация статической страницы кабинета игрока на GitHub Pages.
# Сборка не требуется: workflow копирует в артефакт только файлы сайта
# (index.html, config.js, assets/), поэтому README и папка supabase/ на Pages не попадают.

name: Deploy player page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Если заданы repository variables, подставляем реальные адрес и ключ Supabase.
      # Без них страница публикуется с пустыми значениями и работает в демо-режиме.
      - name: Inject Supabase config (optional)
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        run: |
          cat > config.js <<CONFIG
          window.FISHBOT_CONFIG = {
              supabaseUrl: '${{ vars.SUPABASE_URL }}',
              supabaseAnonKey: '${{ vars.SUPABASE_ANON_KEY }}',
              schemaVersion: 4,
              imagesVersion: 3
          };
          CONFIG

      # Собираем чистый артефакт: только то, что должно быть доступно посетителю.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html config.js _site/
          cp -r assets _site/
          test -f _site/index.html
          test -f _site/config.js
          test -f _site/assets/app.js
          test -f _site/assets/style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
